---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dolt
  labels:
    app: dolt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dolt
  template:
    metadata:
      labels:
        app: dolt
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: iSCSI
                operator: In
                values:
                - "true"
              - key: tpu
                operator: NotIn
                values:
                - "true"
              - key: egress.network/internet
                operator: NotIn
                values:
                - "true"
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - k3s-worker-02
      imagePullSecrets:
      - name: image-registry-credentials
      containers:
      - name: dolt
        imagePullPolicy: "IfNotPresent"
        image: 192.168.50.222:32050/dolthub/dolt@sha256:8a822610f9fffab0e347a9d4a0cce2a53444e7e6fb459a684b6b9fa721dfcbb4
        args:
          - sql-server
          - --config
          - /etc/dolt/server.yaml
        ports:
          - containerPort: 3307
            name: mysql
            protocol: TCP
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        startupProbe:
          tcpSocket:
            port: 3307
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: 3307
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 3307
          periodSeconds: 10
        volumeMounts:
          - name: synology-iscsi-dolt
            mountPath: /var/lib/dolt
          - name: dolt-config
            mountPath: /etc/dolt/server.yaml
            subPath: server.yaml
      volumes:
       - name: synology-iscsi-dolt
         persistentVolumeClaim:
           claimName: synology-dolt
       - name: dolt-config
         configMap:
           name: dolt-config
