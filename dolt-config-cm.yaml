---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dolt-config
data:
  server.yaml: |
    log_level: info
    log_format: text

    behavior:
      read_only: false
      autocommit: true
      disable_client_multi_statements: false
      dolt_transaction_commit: false
      event_scheduler: "ON"
      auto_gc_behavior:
        enable: true
        archive_level: 1

    listener:
      host: 0.0.0.0
      port: 3307
      max_connections: 100

    data_dir: /var/lib/dolt
    cfg_dir: /var/lib/dolt/.doltcfg
